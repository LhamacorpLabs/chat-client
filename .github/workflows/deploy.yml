name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
        type: string

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  version:
    name: Version
    runs-on: self-hosted
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: echo "version=$(date -u +%-y).$(date -u +%-m).${{ github.run_number }}" >> $GITHUB_OUTPUT

  test:
    name: Test
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-image:
    name: Build & Push Image
    needs: [test, version]
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the application
        run: npm run build
        env:
          PUBLIC_CHAT_API_URL: https://chat-be.lhamacorp.com
          PUBLIC_AUTH_API_URL: https://auth.lhamacorp.com
          PUBLIC_AUTH_UI_URL: https://login.lhamacorp.com
          PUBLIC_MQTT_BROKER_URL: wss://mqtt.lhamacorp.com
          PUBLIC_REALTIME_MODE: mqtt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push multi-platform Docker images
        run: |
          docker buildx create --use
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg PUBLIC_CHAT_API_URL=https://chat-be.lhamacorp.com \
            --build-arg PUBLIC_AUTH_API_URL=https://auth.lhamacorp.com \
            --build-arg PUBLIC_AUTH_UI_URL=https://login.lhamacorp.com \
            --build-arg PUBLIC_MQTT_BROKER_URL=wss://mqtt.lhamacorp.com \
            --build-arg PUBLIC_REALTIME_MODE=mqtt \
            --build-arg APP_VERSION=${{ needs.version.outputs.version }} \
            -t lhamacorp/chat-client:latest . --push

  deploy:
    name: Deploy
    needs: build-image
    runs-on: self-hosted
    steps:
      - name: Trigger Portainer Webhook
        run: curl --location --request POST '${{ secrets.DEPLOY_WEBHOOK }}'
