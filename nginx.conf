server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Handle SvelteKit client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SvelteKit's build output under /_app/ is content-hashed (a new build
    # produces new filenames), so caching it forever is safe. This location
    # is checked before the general static-asset rule below.
    location ^~ /_app/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else static (logo.png, favicon.ico, robots.txt, ...) keeps
    # a stable filename across deploys - marking these immutable meant a
    # visitor who loaded the page once would never see an updated icon/logo
    # again for a year. Short cache with revalidation instead.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;
}